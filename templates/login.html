<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به پنل مدیریت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #1e293b, #334155);
               min-height: 100vh; display: flex; align-items: center;
               font-family: Tahoma, sans-serif; }
        .login-card { max-width: 420px; margin: auto; border-radius: 16px;
                      box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 48px;"></i>
                <h4 class="mt-3">پنل مدیریت</h4>
                <p class="text-muted small">برای ادامه وارد شوید</p>
            </div>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="post" action="/panel/login">
                <div class="mb-3">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> ورود
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
